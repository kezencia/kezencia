<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -70 180 200" width="180" height="200" shape-rendering="crispEdges">
<title>Maskot blob pixel dengan headphone, bergantian antara menikmati musik dan menatap datar</title>
<desc>Karakter blob pixel lilac memakai headphone abu-putih, bergoyang dan berdendang sambil mata terpejam menikmati musik, lalu diam menatap datar tanpa musik, berulang.</desc>

<g id="musicPhase">
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.7;0.7;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>

  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 60 40;4 60 40;-4 60 40" keyTimes="0;0.5;1" dur="0.7s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 8;0 2;0 8" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite"/>

      <rect x="-6" y="8" width="132" height="6" rx="3" fill="#B8B4B8"/>
      <rect x="-6" y="12" width="20" height="16" rx="2" fill="#B8B4B8"/>
      <rect x="106" y="12" width="20" height="16" rx="2" fill="#B8B4B8"/>

      <rect x="24" y="0" width="72" height="13" fill="#C8A2C8"/>
      <rect x="12" y="12" width="96" height="13" fill="#C8A2C8"/>
      <rect x="0" y="24" width="120" height="13" fill="#C8A2C8"/>
      <rect x="0" y="36" width="120" height="13" fill="#C8A2C8"/>
      <rect x="0" y="48" width="120" height="13" fill="#C8A2C8"/>
      <rect x="0" y="60" width="120" height="13" fill="#C8A2C8"/>
      <rect x="0" y="72" width="120" height="13" fill="#C8A2C8"/>
      <rect x="12" y="84" width="96" height="13" fill="#C8A2C8"/>
      <rect x="24" y="96" width="72" height="13" fill="#C8A2C8"/>
      <rect x="36" y="108" width="48" height="13" fill="#C8A2C8"/>

      <path d="M -6,24 H 14 V 49 A 7,7 0 0 1 7,56 H 1 A 7,7 0 0 1 -6,49 Z" fill="#B8B4B8"/>
      <path d="M 106,24 H 126 V 49 A 7,7 0 0 1 119,56 H 113 A 7,7 0 0 1 106,49 Z" fill="#B8B4B8"/>
      <rect x="-1" y="32" width="10" height="18" rx="4" fill="#E5E2E4"/>
      <rect x="111" y="32" width="10" height="18" rx="4" fill="#E5E2E4"/>

      <rect x="32" y="42" width="16" height="4" fill="#4A3B4A"/>
      <rect x="72" y="42" width="16" height="4" fill="#4A3B4A"/>
      <rect x="48" y="76" width="24" height="4" fill="#4A3B4A"/>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-6 -30;-10 -55" keyTimes="0;0.5;1" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;1" dur="1.8s" repeatCount="indefinite"/>
    <rect x="128" y="2" width="4" height="14" fill="#B8B4B8"/>
    <rect x="128" y="2" width="10" height="4" fill="#B8B4B8"/>
    <rect x="124" y="12" width="8" height="7" rx="2" fill="#B8B4B8"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;8 -28;14 -50" keyTimes="0;0.5;1" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;1" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
    <rect x="140" y="16" width="4" height="14" fill="#E5E2E4"/>
    <rect x="140" y="16" width="10" height="4" fill="#E5E2E4"/>
    <rect x="136" y="26" width="8" height="7" rx="2" fill="#E5E2E4"/>
  </g>

  <text x="60" y="-18" font-family="monospace" font-size="15" fill="#8B6F8B" text-anchor="middle">
    Hmm...
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.32;0.4;0.44;1" dur="10s" repeatCount="indefinite"/>
  </text>
</g>

<g id="flatPhase">
  <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.7;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>

  <rect x="-6" y="8" width="132" height="6" rx="3" fill="#B8B4B8"/>
  <rect x="-6" y="12" width="20" height="16" rx="2" fill="#B8B4B8"/>
  <rect x="106" y="12" width="20" height="16" rx="2" fill="#B8B4B8"/>

  <rect x="24" y="0" width="72" height="13" fill="#C8A2C8"/>
  <rect x="12" y="12" width="96" height="13" fill="#C8A2C8"/>
  <rect x="0" y="24" width="120" height="13" fill="#C8A2C8"/>
  <rect x="0" y="36" width="120" height="13" fill="#C8A2C8"/>
  <rect x="0" y="48" width="120" height="13" fill="#C8A2C8"/>
  <rect x="0" y="60" width="120" height="13" fill="#C8A2C8"/>
  <rect x="0" y="72" width="120" height="13" fill="#C8A2C8"/>
  <rect x="12" y="84" width="96" height="13" fill="#C8A2C8"/>
  <rect x="24" y="96" width="72" height="13" fill="#C8A2C8"/>
  <rect x="36" y="108" width="48" height="13" fill="#C8A2C8"/>

  <path d="M -6,24 H 14 V 49 A 7,7 0 0 1 7,56 H 1 A 7,7 0 0 1 -6,49 Z" fill="#B8B4B8"/>
  <path d="M 106,24 H 126 V 49 A 7,7 0 0 1 119,56 H 113 A 7,7 0 0 1 106,49 Z" fill="#B8B4B8"/>
  <rect x="-1" y="32" width="10" height="18" rx="4" fill="#E5E2E4"/>
  <rect x="111" y="32" width="10" height="18" rx="4" fill="#E5E2E4"/>

  <rect x="34" y="38" width="12" height="12" fill="#4A3B4A"/>
  <rect x="74" y="38" width="12" height="12" fill="#4A3B4A"/>
</g>
</svg>
